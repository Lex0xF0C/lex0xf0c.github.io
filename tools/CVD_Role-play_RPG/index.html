<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVD Role-play RPG</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --ink: #f8fafc;
      --sub: #94a3b8;
      --line: #334155;
      --accent: #38bdf8;
      --danger: #f43f5e;
      --success: #22c55e;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    .container { max-width: 800px; margin: 0 auto; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      color: var(--accent);
      border-bottom: 2px solid var(--line);
      padding-bottom: 12px;
      margin-bottom: 16px;
      font-weight: bold;
    }
    .status-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      background: rgba(15, 23, 42, 0.6);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
    }
    .status-item {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
      color: var(--sub);
    }
    .status-val {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--ink);
      margin-top: 2px;
    }
    .speaker-tag {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .dialogue-box {
      background: #0f172a;
      border-left: 4px solid var(--accent);
      padding: 16px;
      border-radius: 0 8px 8px 0;
      font-size: 1.05rem;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }
    .choice-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: #334155;
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 14px 16px;
      margin-top: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .choice-btn:hover:not(:disabled) {
      background: #475569;
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .choice-btn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }
    .feedback-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      background: #1e293b;
      border: 1px solid var(--line);
      display: none;
    }
    .feedback-box.correct { border-left: 5px solid var(--success); background: rgba(34, 197, 94, 0.1); }
    .feedback-box.incorrect { border-left: 5px solid var(--danger); background: rgba(244, 63, 94, 0.1); }
    .action-btn {
      display: block;
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      font-size: 1rem;
      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 16px;
      text-align: center;
      transition: background 0.2s;
    }
    .action-btn:hover { background: #7dd3fc; }
    .report-area {
      width: 100%;
      height: 240px;
      background: #0f172a;
      color: var(--sub);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      resize: vertical;
      margin-top: 10px;
    }
    .ending-title { font-size: 1.4rem; font-weight: bold; margin-bottom: 10px; }
    .ending-success { color: var(--success); }
    .ending-failure { color: var(--danger); }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <div class="header-title">
        <span>🛡️</span>
        <span>CVD修羅場シミュレーター (CVD Role-play RPG)</span>
      </div>
      <div class="status-bar" id="statusBar"></div>
    </div>

    <div class="panel" id="gamePanel">
      <h2 id="sceneTitle">シナリオ読み込み中...</h2>
      <div id="speakerTag" class="speaker-tag"></div>
      <div id="dialogueText" class="dialogue-box"></div>
      <div id="choicesArea"></div>
      <div id="feedbackBox" class="feedback-box"></div>
      <button id="nextBtn" class="action-btn" style="display:none;">次へ進む ▶</button>
    </div>

    <div class="panel" id="endPanel" style="display:none;">
      <div id="endingHeader"></div>
      <p id="endingDesc" style="font-size: 1.05rem; margin-bottom: 20px;"></p>
      <h3>📊 振り返りレポート (Post-Mortem Report)</h3>
      <textarea id="reportText" class="report-area" readonly></textarea>
      <button id="copyBtn" class="action-btn" onclick="copyReport()">📋 レポートをクリップボードにコピー</button>
      <button class="action-btn" style="background:var(--line); color:var(--ink);" onclick="initGame()">🔄 最初からリトライ</button>
    </div>
  </div>

    };

    function renderStatus() {
      const hpHearts = "❤️".repeat(Math.max(0, state.mentalHp)) || "💀";
      const sb = document.getElementById("statusBar");
      sb.innerHTML = `
        <div class="status-item"><span>🧠 PSIRTメンタル</span><span class="status-val">${hpHearts}</span></div>
        <div class="status-item"><span>💻 開発チーム信頼</span><span class="status-val">${state.devTrust}%</span></div>
        <div class="status-item"><span>🕵️ 発見者信頼</span><span class="status-val">${state.finderTrust}%</span></div>
        <div class="status-item"><span>👔 経営陣支持度</span><span class="status-val">${state.execSupport}%</span></div>
      `;
    }

    function initGame() {
      state = { ...initialStats };
      historyLog = [];
      document.getElementById("gamePanel").style.display = "block";
      document.getElementById("endPanel").style.display = "none";
      loadScene("start");
    }

    function loadScene(sceneId) {
      currentSceneId = sceneId;
      const scene = SCENARIOS[sceneId];
      if (!scene) return;

      renderStatus();

      if (scene.isEnd) {
        showEnding(scene);
        return;
      }

      document.getElementById("sceneTitle").textContent = scene.title;
      document.getElementById("speakerTag").textContent = scene.speaker;
      document.getElementById("dialogueText").textContent = scene.dialogue;

      const choicesArea = document.getElementById("choicesArea");
      choicesArea.innerHTML = "";
      document.getElementById("feedbackBox").style.display = "none";
      document.getElementById("nextBtn").style.display = "none";

      scene.choices.forEach((choice, idx) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = `${String.fromCharCode(65 + idx)}. ${choice.text}`;
        btn.onclick = () => selectChoice(choice);
        choicesArea.appendChild(btn);
      });
    }

    function selectChoice(choice) {
      if (choice.effects) {
        if (choice.effects.mentalHp !== undefined) state.mentalHp += choice.effects.mentalHp;
        if (choice.effects.devTrust !== undefined) state.devTrust = Math.max(0, Math.min(100, state.devTrust + choice.effects.devTrust));
        if (choice.effects.finderTrust !== undefined) state.finderTrust = Math.max(0, Math.min(100, state.finderTrust + choice.effects.finderTrust));
        if (choice.effects.execSupport !== undefined) state.execSupport = Math.max(0, Math.min(100, state.execSupport + choice.effects.execSupport));
      }

      renderStatus();

      const scene = SCENARIOS[currentSceneId];
      historyLog.push({
        sceneTitle: scene.title,
        choiceText: choice.text,
        feedback: choice.feedback,
        isCorrect: choice.isCorrect
      });

      const btns = document.querySelectorAll(".choice-btn");
      btns.forEach(b => { b.disabled = true; });

      const fbBox = document.getElementById("feedbackBox");
      fbBox.className = "feedback-box " + (choice.isCorrect ? "correct" : "incorrect");
      fbBox.innerHTML = `<strong>${choice.isCorrect ? "💡 CVD解説" : "⚠️ 問題点"}:</strong><p style="margin:6px 0 0 0;">${choice.feedback}</p>`;
      fbBox.style.display = "block";

      const nextBtn = document.getElementById("nextBtn");
      nextBtn.style.display = "block";

      if (state.mentalHp <= 0) {
        nextBtn.onclick = () => loadScene("badend_mental");
      } else {
        nextBtn.onclick = () => loadScene(choice.nextId);
      }
    }

    function showEnding(scene) {
      document.getElementById("gamePanel").style.display = "none";
      const endPanel = document.getElementById("endPanel");
      endPanel.style.display = "block";

      const header = document.getElementById("endingHeader");
      header.className = "ending-title " + (scene.isSuccess ? "ending-success" : "ending-failure");
      header.textContent = scene.title;

      document.getElementById("endingDesc").textContent = scene.dialogue;

      generateReport(scene.isSuccess);
    }

    function generateReport(isSuccess) {
      let md = `# 🛡️ CVD修羅場シミュレーション 振り返りレポート\n\n`;
      md += `## ■ 判定結果\n`;
      md += `- 結果: ${isSuccess ? "成功（協調的開示達成）" : "失敗（ゲームオーバー）"}\n`;
      md += `- 最終ステータス:\n`;
      md += `  - PSIRTメンタル: ${"❤️".repeat(Math.max(0, state.mentalHp))}\n`;
      md += `  - 開発チーム信頼度: ${state.devTrust}%\n`;
      md += `  - 外部発見者信頼度: ${state.finderTrust}%\n`;
      md += `  - 経営陣支持度: ${state.execSupport}%\n\n`;
      md += `## ■ 対応の軌跡と学習のポイント\n`;

      historyLog.forEach((item, i) => {
        md += `### ${i + 1}. ${item.sceneTitle}\n`;
        md += `- **選択した対応**: ${item.choiceText}\n`;
        md += `- **CVD解説**: ${item.feedback}\n\n`;
      });

      document.getElementById("reportText").value = md;
    }

    function copyReport() {
      const area = document.getElementById("reportText");
      area.select();
      document.execCommand("copy");
      alert("振り返りレポート(Markdown)をクリップボードにコピーしました！");
    }

    window.onload = initGame;
  </script>
</body>
</html>
